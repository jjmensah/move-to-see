<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A robot with a simulated 3D LiDAR decides where to drive to find a dark target in fog and sunlight. Replay 480 recorded trials, change the sensor physics and inspect the planner's choices." />
    <meta name="theme-color" content="#ef6a6e" />
    <script>
      // Resolve the theme before first paint (mirrors src/theme.ts).
      (function () {
        var t = "light";
        try {
          var s = localStorage.getItem("mts-theme");
          t = s === "light" || s === "dark" ? s : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e2) {}
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#3a1c21" : "#ef6a6e";
      })();
    </script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Move to See</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site draws its replays and charts with JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
